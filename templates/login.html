<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | LAB-CONTROL PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1527; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background-color: #111c35; border: 1px solid #1e293b; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-control { background-color: #0b1120 !important; color: #ffffff !important; border: 1px solid #1e293b; }
        .form-control:focus { border-color: #0284c7; box-shadow: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="text-center text-info mb-3 fw-bold">⚙️ LAB-CONTROL PRO</h4>
        <p class="text-center text-secondary small mb-4">Gestión Profesional para Talleres Electrónicos</p>
        
        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small text-secondary">Usuario</label>
                <input type="text" name="usuario" class="form-control form-control-sm" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">Contraseña</label>
                <input type="password" name="password" class="form-control form-control-sm" required>
            </div>
            <button type="submit" class="btn btn-info btn-sm w-100 fw-bold my-2 text-white">Ingresar al Sistema</button>
        </form>
        
        <hr class="border-secondary my-3">
        
        <form method="POST" action="/registro">
            <h6 class="text-secondary small fw-bold mb-2">Nuevo Suscriptor / Taller</h6>
            <div class="mb-2">
                <input type="text" name="usuario" class="form-control form-control-sm" placeholder="Usuario nuevo" required>
            </div>
            <div class="mb-2">
                <input type="password" name="password" class="form-control form-control-sm" placeholder="Contraseña" required>
            </div>
            <div class="mb-3">
                <input type="text" name="nombre_taller" class="form-control form-control-sm" placeholder="Nombre de tu Taller" required>
            </div>
            <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">Registrar Taller</button>
        </form>
    </div>
</body>
</html>
