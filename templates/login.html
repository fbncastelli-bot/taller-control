<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LAB-CONTROL PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff !important; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: #ffffff !important; }
        .form-label, h5, p, label { color: #ffffff !important; }
        .form-control { background-color: #2b2b2b !important; color: #ffffff !important; border: 1px solid #444; }
        .form-control::placeholder { color: #aaaaaa !important; }
        .form-control:focus { background-color: #333333 !important; color: #ffffff !important; border-color: #0d6efd; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
        <h3 class="text-center text-primary mb-3">LAB-CONTROL PRO</h3>
        <h5 class="text-center mb-4">Iniciar Sesión</h5>
        
        {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="****" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Ingresar</button>
        </form>
        
        <div class="text-center pt-2 border-top border-secondary">
            <p class="mb-2">¿No tenés un taller registrado?</p>
            <a href="/registro" class="btn btn-outline-success w-100 font-weight-bold">Crear Nuevo Taller</a>
        </div>
    </div>
</body>
</html>
