<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-CONTROL PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: #fff; }
        .form-control, .form-select { background-color: #2b2b2b !important; color: #fff !important; border: 1px solid #444; }
        .table-dark { background-color: #1e1e1e; color: #fff; }
        .nav-tabs .nav-link { color: #aaa; }
        .nav-tabs .nav-link.active { background-color: #0d6efd; color: #fff; border: none; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>LAB-CONTROL PRO <small class="text-muted fs-6">| {{ taller }} ({{ usuario }})</small></h2>
            <a href="/logout" class="btn btn-outline-danger btn-sm">🚪 Cerrar Sesión</a>
        </div>

        <ul class="nav nav-tabs mb-3" id="mainTab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#ordenes">📋 Órdenes</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#repuestos">📦 Stock Componentes</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#caja">💰 Caja / Finanzas</button></li>
        </ul>

        <div class="tab-content">
            <!-- TAB ORDENES -->
            <div class="tab-pane fade show active" id="ordenes">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card p-3 mb-3">
                            <h5>Nueva Órden de Trabajo</h5>
                            <form id="form-orden">
                                <input type="text" id="ord-cliente" class="form-control mb-2" placeholder="Cliente" required>
                                <input type="text" id="ord-telefono" class="form-control mb-2" placeholder="Teléfono (ej: 54911...)">
                                <input type="text" id="ord-equipo" class="form-control mb-2" placeholder="Equipo / Modelo" required>
                                <textarea id="ord-falla" class="form-control mb-2" placeholder="Falla reportada"></textarea>
                                <input type="number" id="ord-presupuesto" class="form-control mb-2" placeholder="Presupuesto ($)">
                                <button type="submit" class="btn btn-primary w-100">Guardar Órden</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5>Órdenes Registradas</h5>
                            <div class="table-responsive">
                                <table class="table table-dark table-hover mt-2">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Cliente</th>
                                            <th>Equipo</th>
                                            <th>Falla</th>
                                            <th>Estado</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-ordenes"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB REPUESTOS -->
            <div class="tab-pane fade" id="repuestos">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card p-3 mb-3">
                            <h5>Nuevo Componente</h5>
                            <form id="form-repuesto">
                                <input type="text" id="rep-nombre" class="form-control mb-2" placeholder="Nombre (ej: Capacitor 10uF)" required>
                                <input type="text" id="rep-categoria" class="form-control mb-2" placeholder="Categoría (ej: Capacitores)">
                                <input type="text" id="rep-ubicacion" class="form-control mb-2" placeholder="Ubicación (ej: Cajón A1)">
                                <input type="number" id="rep-cantidad" class="form-control mb-2" placeholder="Cantidad" value="1" min="1">
                                <button type="submit" class="btn btn-success w-100">Guardar Componente</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5>Inventario de Componentes</h5>
                            <div class="table-responsive">
                                <table class="table table-dark table-hover mt-2">
                                    <thead>
                                        <tr>
                                            <th>Componente</th>
                                            <th>Categoría</th>
                                            <th>Ubicación</th>
                                            <th>Cantidad</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-repuestos"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB CAJA -->
            <div class="tab-pane fade" id="caja">
                <div class="card p-3">
                    <h5>Movimientos de Caja</h5>
                    <p id="balance-caja" class="fw-bold fs-5 text-info">Balance: $0.00</p>
                    <div class="table-responsive">
                        <table class="table table-dark mt-2">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Concepto</th>
                                    <th>Monto</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-caja"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cargar Órdenes
        async function cargarOrdenes() {
            const res = await fetch('/api/ordenes');
            if (!res.ok) return;
            const data = await res.json();
            const tbody = document.getElementById('tabla-ordenes');
            tbody.innerHTML = '';
            data.forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.cliente}</td>
                        <td>${o.equipo}</td>
                        <td>${o.falla || ''}</td>
                        <td><span class="badge bg-warning">${o.estado}</span></td>
                        <td><button class="btn btn-sm btn-danger" onclick="borrarOrden(${o.id})">🗑️</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('form-orden').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                cliente: document.getElementById('ord-cliente').value,
                telefono: document.getElementById('ord-telefono').value,
                equipo: document.getElementById('ord-equipo').value,
                falla: document.getElementById('ord-falla').value,
                presupuesto: document.getElementById('ord-presupuesto').value || 0
            };
            const res = await fetch('/api/ordenes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                document.getElementById('form-orden').reset();
                cargarOrdenes();
            }
        });

        async function borrarOrden(id) {
            await fetch(`/api/ordenes/${id}`, { method: 'DELETE' });
            cargarOrdenes();
        }

        // Cargar Repuestos
        async function cargarRepuestos() {
            const res = await fetch('/api/repuestos');
            if (!res.ok) return;
            const data = await res.json();
            const tbody = document.getElementById('tabla-repuestos');
            tbody.innerHTML = '';
            data.forEach(r => {
                tbody.innerHTML += `
                    <tr>
                        <td>${r.nombre}</td>
                        <td>${r.categoria || '-'}</td>
                        <td>${r.ubicacion || '-'}</td>
                        <td>${r.cantidad}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="borrarRepuesto(${r.id})">🗑️</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('form-repuesto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                nombre: document.getElementById('rep-nombre').value,
                categoria: document.getElementById('rep-categoria').value,
                ubicacion: document.getElementById('rep-ubicacion').value,
                cantidad: document.getElementById('rep-cantidad').value || 1
            };
            const res = await fetch('/api/repuestos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                document.getElementById('form-repuesto').reset();
                cargarRepuestos();
            }
        });

        async function borrarRepuesto(id) {
            await fetch(`/api/repuestos/${id}`, { method: 'DELETE' });
            cargarRepuestos();
        }

        // Inicializar
        cargarOrdenes();
        cargarRepuestos();
    </script>
</body>
</html>
