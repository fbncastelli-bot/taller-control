<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/app.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🔧 Taller Control</h1>
            <span class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Sistema de Gestión</span>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <section class="bg-white rounded-lg shadow p-6 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800">Órdenes de Trabajo</h2>
                    <div class="flex gap-2">
                        <button id="btnAnalizarIA" onclick="analizarFallaIA()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded shadow transition">
                            🤖 Analizar Falla con IA
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-sm">
                                <th class="p-3">ID</th>
                                <th class="p-3">Cliente</th>
                                <th class="p-3">Equipo</th>
                                <th class="p-3">Falla</th>
                                <th class="p-3">Presupuesto</th>
                                <th class="p-3">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaOrdenesBody" class="cursor-pointer divide-y divide-slate-100">
                            <!-- Filas cargadas por app.js -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
