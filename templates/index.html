<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TallerControl OS - Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f17',
                        cardbg: '#151d2a',
                        bordercolor: '#26334d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-200 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar / Menú Lateral -->
    <aside class="w-64 bg-cardbg border-r border-bordercolor flex flex-col justify-between">
        <div class="p-4">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">TC</div>
                <div>
                    <h1 class="font-bold text-white leading-none">TallerControl</h1>
                    <span class="text-xs text-slate-400">Servicio Técnico</span>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-md shadow-blue-600/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    Órdenes
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    Clientes
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Repuestos / Stock
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Caja y Balance
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-bordercolor">
            <button onclick="abrirModalNuevaOrden()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Nueva Orden
            </button>
        </div>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar / Buscador -->
        <header class="h-16 bg-cardbg/50 border-b border-bordercolor px-6 flex items-center justify-between">
            <div class="relative w-96">
                <input type="text" id="searchInput" onkeyup="filtrarOrdenes()" placeholder="Buscar cliente, equipo o N° orden..." class="w-full bg-darkbg border border-bordercolor rounded-xl py-2 pl-10 pr-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
        </header>

        <!-- Contenido principal -->
        <div class="flex-1 overflow-y-auto p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-white">Órdenes de Trabajo</h2>
            </div>

            <!-- Listado de tarjetas -->
            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se cargan dinámicamente con app.js -->
            </div>
        </div>
    </main>

    <!-- Modal Nueva Orden -->
    <div id="modalNuevaOrden" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-cardbg border border-bordercolor w-full max-w-lg rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Ingresar Nueva Orden de Servicio</h3>
            <form id="formNuevaOrden" onsubmit="guardarOrden(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre del Cliente</label>
                    <input type="text" id="clienteInput" required class="w-full bg-darkbg border border-bordercolor rounded-lg py-2 px-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Equipo / Modelo</label>
                    <input type="text" id="equipoInput" required placeholder="Ej: Smart TV LG 43 - LC430DUE" class="w-full bg-darkbg border border-bordercolor rounded-lg py-2 px-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Falla Declarada</label>
                    <textarea id="fallaInput" rows="3" required placeholder="Ej: No enciende, titila LED frontal..." class="w-full bg-darkbg border border-bordercolor rounded-lg py-2 px-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="cerrarModalNuevaOrden()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg text-sm transition">Guardar Orden</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
