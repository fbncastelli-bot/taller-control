<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Taller - LAB-CONTROL PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .form-control { background-color: #2b2b2b; color: #fff; border: 1px solid #444; }
        .form-control:focus { background-color: #333; color: #fff; border-color: #0d6efd; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
        <h3 class="text-center text-primary mb-3">LAB-CONTROL PRO</h3>
        <h5 class="text-center mb-4">Registrar Nuevo Taller</h5>
        
        <form action="/registro" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre del Taller</label>
                <input type="text" name="nombre_taller" class="form-control" placeholder="Ej: Indianapolis" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="Ej: Ricardo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono de Contacto</label>
                <input type="text" name="telefono_taller" class="form-control" placeholder="Ej: 1164992829">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="****" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Crear Taller e Iniciar</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/login" class="text-secondary text-decoration-none">¿Ya tenés cuenta? Iniciar Sesión</a>
        </div>
    </div>
</body>
</html>
